name: Subject Release with English Links

on:
  workflow_dispatch:

jobs:
  release-and-link:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Subjects
        shell: bash
        run: |
          # 1. Iterate through first-level directories
          for dir in $(find . -maxdepth 1 -type d ! -name ".*" ! -name "."); do
            folder_name=${dir#./}
            
            # 2. Extract subject code (e.g., 9702)
            subject_code=$(echo "$folder_name" | grep -oE '[0-9]{4}' | tail -1 || echo "$folder_name")
            
            # 3. Construct parameters
            tag_name="rel-${folder_name}"
            zip_file="${folder_name}.zip"
            download_url="https://github.com/${{ github.repository }}/releases/download/${tag_name}/${zip_file}"
            
            echo "------------------------------------------------"
            echo "📦 Processing: $folder_name"

            # 4. Create README.md using printf (Avoids cat <<EOF indentation issues)
            printf "# %s Resources Download Guide\n\n" "$subject_code" > "$folder_name/README.md"
            printf "> [!TIP]\n" >> "$folder_name/README.md"
            printf "> **Meow~ If you want to download all PDFs for this subject only**\n\n,Click this link!" >> "$folder_name/README.md"
            printf "## [🚀 Download All PDFs (%s)](%s)\n\n" "$subject_code" "$download_url" >> "$folder_name/README.md"
            printf "---\n" >> "$folder_name/README.md"
            printf "*Papers before 2017 are organized in the \`Early\` folder.*\n" >> "$folder_name/README.md"

            # 5. Cloud Zipping
            zip -r "$zip_file" "$folder_name"

            # 6. Create Release
            release_title="${subject_code} Autorelease"
            gh release create "$tag_name" "$zip_file" \
              --title "$release_title" \
              --notes "Automated release for $folder_name. Direct download link added to folder README." \
              --clobber
            
            rm "$zip_file"
          done

      - name: Commit and Push READMEs
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "docs: add direct download links to subject folders"
            git push origin main
          else
            echo "No changes detected."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
