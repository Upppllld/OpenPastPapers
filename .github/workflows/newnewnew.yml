name: Robust Per-Folder Release

on:
  workflow_dispatch: # Manually trigger

jobs:
  release-folders:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for creating tags and releases

    steps:
      - name: Maximize Disk Space
        # Prevents "No space left on device" by removing unused pre-installed tools
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history and tags

      - name: Process Folders and Create Releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git identity for tag creation
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Iterate through first-level directories only
          for dir in $(find . -maxdepth 1 -type d ! -name ".*" ! -name "."); do
            folder_name=${dir#./}
            
            # Extract 4-digit subject code (e.g., 9702)
            subject_code=$(echo "$folder_name" | grep -oE '[0-9]{4}' | tail -1 || echo "$folder_name")
            
            tag_name="rel-${folder_name}"
            zip_file="${folder_name}.zip"
            release_title="${subject_code} Autorelease"

            echo "------------------------------------------------"
            echo "📦 Processing: $folder_name"

            # 1. Zip the folder
            zip -r "$zip_file" "$folder_name"

            # 2. ROOT-CAUSE FIX: Ensure Tag Consistency
            # Force create the tag locally
            git tag -f "$tag_name"
            # Force push the tag to remote (this fixes "tag doesn't exist" or mismatch errors)
            git push origin "$tag_name" --force

            # 3. Create or Update Release
            # --clobber: Overwrites the asset if it already exists
            # We use the existing tag we just pushed
            gh release create "$tag_name" "$zip_file" \
              --title "$release_title" \
              --notes "Automated release for $folder_name." \
              --clobber

            # 4. Immediate Cleanup to save disk space
            rm "$zip_file"
            echo "✅ Successfully released $folder_name"
          done
